name: Build and Publish Debug APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ] || ! [ "$JAVA_MAJOR" -ge 0 ] 2>/dev/null; then
            echo "::error::Could not detect active Java major version."
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java environment verified: version $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f ./debug.keystore ]; then
            echo "debug.keystore already exists. Reusing existing debug keystore."
          else
            echo "debug.keystore not found. Creating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "Temporary debug keystore created successfully at ./debug.keystore."
          fi

      - name: Assemble Debug APKs (User and Admin)
        run: |
          gradle :app:assembleDebug :admin:assembleDebug --stacktrace --no-daemon

      - name: Verify User and Admin APKs
        run: |
          USER_APK="app/build/outputs/apk/debug/app-debug.apk"
          ADMIN_APK="admin/build/outputs/apk/debug/admin-debug.apk"

          if [ ! -f "$USER_APK" ] || [ ! -s "$USER_APK" ]; then
            echo "::error::User APK not found or empty at $USER_APK"
            exit 1
          fi

          if [ ! -f "$ADMIN_APK" ] || [ ! -s "$ADMIN_APK" ]; then
            echo "::error::Admin APK not found or empty at $ADMIN_APK"
            exit 1
          fi

          echo "Confirmed: Both User and Admin APKs exist and are non-empty."

      - name: Upload User APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EliteXarena-User-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Admin APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EliteXarena-Admin-apk
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        id: prepare_asset
        run: |
          RELEASE_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$RELEASE_DIR"

          USER_ASSET="${RELEASE_DIR}/EliteXarena-User.apk"
          ADMIN_ASSET="${RELEASE_DIR}/EliteXarena-Admin.apk"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$USER_ASSET"
          cp "admin/build/outputs/apk/debug/admin-debug.apk" "$ADMIN_ASSET"

          echo "user_asset=${USER_ASSET}" >> "$GITHUB_OUTPUT"
          echo "admin_asset=${ADMIN_ASSET}" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release assets: ${USER_ASSET} and ${ADMIN_ASSET}"

      - name: Publish APKs to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          USER_ASSET="${{ steps.prepare_asset.outputs.user_asset }}"
          ADMIN_ASSET="${{ steps.prepare_asset.outputs.admin_asset }}"

          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          RELEASE_TITLE="EliteXarena Release Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ### EliteXarena Android APKs

          - **EliteXarena-User.apk**: Player Panel APK (Tournaments, Matches, Wallet, Profile, Live Stats). No admin options.
          - **EliteXarena-Admin.apk**: Admin & Staff Panel APK (Tournament management, Room IDs, Results, KYC, Withdrawal approvals, Support).
          - **Build Type:** Automated Debug Build
          - **Run Number:** ${{ github.run_number }}
          - **Source Commit:** `${{ github.sha }}`
          EOF

          gh release create "$RELEASE_TAG" "$USER_ASSET" "$ADMIN_ASSET" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          RELEASE_TITLE="EliteXarena Release Build #${{ github.run_number }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            {
              echo "## 🚀 Both APKs Built & Released Successfully!"
              echo ""
              echo "- **User App (Players):** \`EliteXarena-User.apk\`"
              echo "- **Admin App (Staff & Admins):** \`EliteXarena-Admin.apk\`"
              echo "- **Release Page:** [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Download APKs:** Available under the **Assets** section of the release."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ⚠️ APKs Built Successfully"
              echo ""
              echo "Both \`EliteXarena-User-apk\` and \`EliteXarena-Admin-apk\` are uploaded to the Actions run Artifacts below."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
